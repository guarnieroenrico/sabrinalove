<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Per Sabrina ♥ (AR)</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 20%,#3b1a2a,#1e0e18 75%)}
  canvas{display:block}
  #info{position:fixed;top:14px;left:0;right:0;text-align:center;color:#ffd9a0;font:26px Caveat,cursive;pointer-events:none}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="info">Apri con il Browser di Meta Quest e premi “START AR” (anteprima su PC: trascina per guardarti intorno)</div>
<script src="media_config.js" onerror="void 0"></script>
<script type="module">
import * as THREE from 'three';
import {ARButton} from 'three/addons/webxr/ARButton.js';

/* ============ CONFIGURAZIONE ============ */
const NOME = "Sabrina", START_DATE = null, MUSIC = "musica.mp3";
const FINAL_TEXT =
`Non so come fai a rendere speciale anche il giorno più normale.
Ti auguro un anno pieno di sorrisi, di cose che ti fanno battere forte il cuore e di sogni che si avverano.
Qualunque cosa succeda, io sono qui, a fare il tifo per te.`;
const DEFAULT_ITEMS = [
  {type:"photo",caption:"Il giorno in cui ti ho vista e il mondo ha rallentato."},
  {type:"photo",caption:"Il tuo sorriso è il mio posto preferito."},
  {type:"video",caption:"Ascolta come ridi: è la mia canzone preferita."},
  {type:"photo",caption:"Con te anche le giornate storte diventano belle."},
  {type:"photo",caption:"Sei la mia persona preferita con cui perdere tempo."},
  {type:"photo",caption:"Non cambiare mai: sei perfetta così."},
  {type:"video",caption:"Un messaggio solo per te..."}
];
/* ========================================= */

const ITEMS = (window.MEDIA && window.MEDIA.length) ? window.MEDIA : DEFAULT_ITEMS, N = ITEMS.length;
const HAND = 'Caveat,"Segoe Script",cursive', SERIF = '"Playfair Display",Georgia,serif';
const SRGB = THREE.SRGBColorSpace;
try { await Promise.all(['500 40px Caveat','700 40px Caveat','500 30px "Playfair Display"','italic 500 30px "Playfair Display"'].map(f => document.fonts.load(f))); } catch(e) {}

/* ---------- renderer / scena ---------- */
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth, innerHeight); renderer.setClearColor(0, 0);
renderer.xr.enabled = true; document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, .05, 50);
camera.position.set(0, 1.6, 0);
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
document.body.appendChild(ARButton.createButton(renderer, {optionalFeatures:['local-floor','hand-tracking']}));

/* ---------- utilità: canvas, testo, pannelli ---------- */
function ctex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); draw(x, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = SRGB; t.anisotropy = 4;
  t.redraw = f => { x.clearRect(0,0,w,h); f(x,w,h); t.needsUpdate = true; };
  return t;
}
function panel(w, h, px, draw){
  const t = ctex(px, Math.round(px*h/w), draw);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({map:t, transparent:true, depthWrite:false}));
  m.userData.tex = t; return m;
}
const rrect = (x,X,Y,W,H,r) => { x.beginPath(); x.roundRect(X,Y,W,H,r); };
function lines(x, t, maxW){
  const out = [];
  t.split('\n').forEach(par => { let l = ''; par.split(' ').forEach(w => { const n = l ? l+' '+w : w; if(l && x.measureText(n).width > maxW){ out.push(l); l = w; } else l = n; }); out.push(l); });
  return out;
}
/* testo centrato che si rimpicciolisce finché entra nel riquadro; n = lettere da mostrare (effetto macchina da scrivere) */
function fitText(x, t, cx, cy, maxW, maxH, fam, size, color, n = 1e9){
  let L;
  for(; size > 16; size -= 2){ x.font = fam.replace('#', size); L = lines(x, t, maxW); if(L.length*size*1.1 <= maxH) break; }
  x.fillStyle = color; x.textAlign = 'left'; x.textBaseline = 'middle';
  const lh = size*1.1, y0 = cy - (L.length-1)*lh/2;
  L.forEach((l,i) => { if(n <= 0) return; x.fillText(l.slice(0,n), cx - x.measureText(l).width/2, y0 + i*lh); n -= l.length + 1; });
}
function button(label, w, h, click){
  const m = panel(w, h, 512, (x,W,H) => {
    const g = x.createLinearGradient(0,0,W,0); g.addColorStop(0,'#ff6f91'); g.addColorStop(1,'#ff9671');
    x.fillStyle = g; rrect(x,4,4,W-8,H-8,(H-8)/2); x.fill();
    x.fillStyle = '#fff'; x.font = '700 '+Math.round(H*.55)+'px '+HAND; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(label, W/2, H/2+4);
  });
  m.userData.click = click; return m;
}

/* ---------- media (foto e video come texture) ---------- */
const PA = .25/.31, videos = [], meds = [];
function phTex(i, type){
  return ctex(256, 320, (x,w,h) => {
    const hu = (i*37+340)%360, g = x.createLinearGradient(0,0,w,h);
    g.addColorStop(0,`hsl(${hu} 70% 62%)`); g.addColorStop(1,`hsl(${(hu+40)%360} 70% 55%)`);
    x.fillStyle = g; x.fillRect(0,0,w,h); x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = '110px serif'; x.fillText('♥', w/2, h/2-20); x.font = '34px '+HAND; x.fillText('qui la tua '+(type==='video'?'video':'foto'), w/2, h/2+70);
  });
}
function cover(t, iw, ih, a){            // ritaglia la texture come object-fit:cover
  const r = iw/ih; t.repeat.set(1,1); t.offset.set(0,0);
  if(r > a){ t.repeat.x = a/r; t.offset.x = (1-t.repeat.x)/2; } else { t.repeat.y = r/a; t.offset.y = (1-t.repeat.y)/2; }
}
function media(it, i, mat){
  const r = {};
  const bad = () => { r.bad = true; r.tex = phTex(i, it.type); mat.map = r.tex; mat.needsUpdate = true; };
  if(!it.src){ bad(); return r; }
  if(it.type === 'video'){
    const v = document.createElement('video');
    Object.assign(v, {src:it.src, muted:true, loop:true, playsInline:true, preload:'auto'});
    v.setAttribute('playsinline',''); videos.push(v);
    r.v = v; r.tex = new THREE.VideoTexture(v); r.tex.colorSpace = SRGB;
    v.addEventListener('loadedmetadata', () => { r.w = v.videoWidth; r.h = v.videoHeight; cover(r.tex, r.w, r.h, PA); });
    v.addEventListener('error', bad);
  } else {
    r.tex = new THREE.TextureLoader().load(it.src, t => { r.w = t.image.width; r.h = t.image.height; cover(t, r.w, r.h, PA); }, undefined, bad);
    r.tex.colorSpace = SRGB;
  }
  mat.map = r.tex; return r;
}
const playAll = () => videos.forEach(v => v.play().catch(() => {}));

/* ---------- stato e posizione dell'utente ---------- */
let state = 'intro', needPlace = false, last = 0;
const taken = new Set(), head = {p:new THREE.Vector3(0,1.6,0), q:new THREE.Quaternion()};
const root = new THREE.Group(); root.visible = false; scene.add(root);
function fwd(){ const d = new THREE.Vector3(0,0,-1).applyQuaternion(head.q); d.y = 0; return d.lengthSq() < 1e-4 ? d.set(0,0,-1) : d.normalize(); }
function front(g){                        // mette un gruppo davanti al viso, rivolto verso di te
  const d = fwd(); g.position.set(head.p.x + d.x*g.userData.dist, head.p.y + (g.userData.dy||0), head.p.z + d.z*g.userData.dist);
  g.rotation.set(0, Math.atan2(-d.x,-d.z), 0);
}
function recenter(){
  const d = fwd(); root.position.set(head.p.x, head.p.y+.2, head.p.z); root.rotation.y = Math.atan2(-d.x,-d.z);
  const g = {intro:introG, view:viewerG, finale:finG}[state]; if(g){ const z = g.rotation.z; front(g); g.rotation.z = z; }
}

/* ---------- il filo con le polaroid (attorno a te) ---------- */
const R = 1.5, STEP = .5/R, pivots = [], papers = [];
const paperGeo = new THREE.PlaneGeometry(.30,.42), photoGeo = new THREE.PlaneGeometry(.25,.31), capGeo = new THREE.PlaneGeometry(.30,.07),
      pinGeo = new THREE.BoxGeometry(.014,.04,.008), shGeo = new THREE.PlaneGeometry(.32,.44), pinM = new THREE.MeshBasicMaterial({color:0xd9a868});
const spts = [];
for(let k = -1; k <= N; k++){
  const a = (k-(N-1)/2)*STEP; spts.push(new THREE.Vector3(Math.sin(a)*R, 0, -Math.cos(a)*R));
  if(k < N){ const b = a + STEP/2; spts.push(new THREE.Vector3(Math.sin(b)*R, -.06, -Math.cos(b)*R)); }
}
root.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(spts,false,'centripetal'), N*40, .004, 5), new THREE.MeshBasicMaterial({color:0xd9b98a})));

ITEMS.forEach((it, i) => {
  const a = (i-(N-1)/2)*STEP, pv = new THREE.Group();
  pv.position.set(Math.sin(a)*R, 0, -Math.cos(a)*R); pv.rotation.y = -a;
  pv.userData = {w:1.2+Math.random()*.6, ph:Math.random()*6.28, am:.03+Math.random()*.035};
  const paperM = new THREE.MeshBasicMaterial({color:0xfffaf2}), photoM = new THREE.MeshBasicMaterial({color:0xffffff}),
        capT = ctex(600,140,(x,w,h) => fitText(x,it.caption,w/2,h/2,w-30,h-8,'500 #px '+HAND,40,'#4a2a30')),
        capM = new THREE.MeshBasicMaterial({map:capT, transparent:true}),
        shM = new THREE.MeshBasicMaterial({color:0, transparent:true, opacity:.28, depthWrite:false});
  const mk = (geo,m,y,z) => { const o = new THREE.Mesh(geo,m); o.position.set(0,y,z); pv.add(o); return o; };
  mk(shGeo, shM, -.222, -.006);
  const paper = mk(paperGeo, paperM, -.21, 0);
  mk(photoGeo, photoM, -.175, .002); mk(capGeo, capM, -.375, .002); mk(pinGeo, pinM, -.005, .006);
  meds[i] = media(it, i, photoM);
  paper.userData = {group:pv, click:() => openViewer(i), mats:[paperM,photoM,capM]};
  root.add(pv); pivots.push(pv); papers.push(paper);
});

/* luci che brillano intorno */
const glow = ctex(64,64,x => { const g = x.createRadialGradient(32,32,0,32,32,32); g.addColorStop(0,'#fff'); g.addColorStop(.3,'rgba(255,217,160,.6)'); g.addColorStop(1,'rgba(255,217,160,0)'); x.fillStyle = g; x.fillRect(0,0,64,64); });
const lp = new Float32Array(90*3);
for(let i = 0; i < 90; i++){ const a = Math.random()*6.283, r = .6+Math.random()*1.9; lp.set([Math.sin(a)*r, -.9+Math.random()*2, -Math.cos(a)*r], i*3); }
const lights = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(lp,3)),
  new THREE.PointsMaterial({map:glow, size:.07, color:0xffd9a0, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending}));
lights.frustumCulled = false; root.add(lights);

/* ---------- contatore + musica ---------- */
const audio = new Audio(MUSIC); audio.loop = true; audio.volume = .6;
const hud = panel(.62,.13,620,() => {}); hud.position.set(0,-.75,-1.15); hud.rotation.x = -.5; root.add(hud);
const drawHud = () => hud.userData.tex.redraw((x,w,h) => { x.fillStyle = 'rgba(0,0,0,.45)'; rrect(x,0,0,w,h,h/2); x.fill(); x.fillStyle = '#fff'; x.font = '500 60px '+HAND; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(`Ricordi staccati: ${taken.size} / ${N}`, w/2, h/2+4); });
drawHud();
const musicBtn = panel(.11,.11,128,(x,w,h) => { x.fillStyle = 'rgba(0,0,0,.45)'; x.beginPath(); x.arc(w/2,h/2,w/2,0,6.283); x.fill(); x.fillStyle = '#fff'; x.font = '64px serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('♪', w/2, h/2+4); });
musicBtn.position.set(.42,-.75,-1.15); musicBtn.rotation.x = -.5; root.add(musicBtn);
musicBtn.userData.click = () => { if(audio.paused){ audio.play().catch(()=>{}); musicBtn.material.opacity = 1; } else { audio.pause(); musicBtn.material.opacity = .45; } };

/* ---------- intro ---------- */
const introG = new THREE.Group(); introG.userData = {dist:1.3, dy:.05}; scene.add(introG);
introG.add(panel(.9,.9,1024,(x,w,h) => {
  x.fillStyle = 'rgba(30,10,22,.85)'; rrect(x,0,0,w,h,60); x.fill(); x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillStyle = '#ffd9a0'; x.font = '500 60px '+HAND; x.fillText('per te', w/2, 120);
  x.save(); x.shadowColor = 'rgba(255,143,163,.8)'; x.shadowBlur = 40; x.fillStyle = '#fff'; x.font = '700 200px '+HAND; x.fillText(NOME, w/2, 300); x.restore();
  x.fillStyle = '#ff8fa3'; x.font = 'italic 500 46px '+SERIF; x.fillText('quindici anni di meraviglia', w/2, 440);
  fitText(x,'Ho appeso i nostri momenti a un filo. Staccali uno a uno, sono tutti per te.',w/2,620,w-200,170,'500 #px '+SERIF,42,'#f3dfe2');
  fitText(x,'Punta con il controller (o pizzica con le dita) e premi per staccare un ricordo.',w/2,830,w-240,110,'500 #px '+HAND,40,'#ffd9a0');
}));
const introBtn = button('Inizia ♥', .46, .12, () => { introG.visible = false; root.visible = true; state = 'browse'; audio.play().catch(()=>{}); playAll(); });
introBtn.position.set(0,-.58,.01); introG.add(introBtn);

/* ---------- visore del ricordo ---------- */
const viewerG = new THREE.Group(); viewerG.userData = {dist:1.0}; viewerG.visible = false; scene.add(viewerG);
const vPaper = new THREE.Mesh(new THREE.PlaneGeometry(.64,.90), new THREE.MeshBasicMaterial({color:0xfffaf2})),
      vBg = new THREE.Mesh(new THREE.PlaneGeometry(.56,.70), new THREE.MeshBasicMaterial({color:0x222222})),
      vMed = new THREE.Mesh(new THREE.PlaneGeometry(.56,.70), new THREE.MeshBasicMaterial()),
      vCapT = ctex(700,170,() => {}),
      vCap = new THREE.Mesh(new THREE.PlaneGeometry(.6,.1457), new THREE.MeshBasicMaterial({map:vCapT, transparent:true})),
      vClose = button('Tienila nel cuore ♥', .5, .115, () => closeViewer());
vBg.position.set(0,.06,.002); vMed.position.set(0,.06,.004); vCap.position.set(0,-.37,.002); vClose.position.set(0,-.6,.01);
viewerG.add(vPaper, vBg, vMed, vCap, vClose);
let typer, cur = -1;
function openViewer(i){
  state = 'view'; cur = i; const it = ITEMS[i], r = meds[i];
  let t = r.tex;
  if(!r.bad){ t = r.vtex || (r.vtex = r.tex.clone()); t.repeat.set(1,1); t.offset.set(0,0); }
  vMed.material.map = t; vMed.material.needsUpdate = true; vMed.scale.set(1,1,1);
  if(r.w && !r.bad){
    if(it.type === 'video'){ const asp = r.w/r.h; if(asp > .8) vMed.scale.y = .8/asp; else vMed.scale.x = asp/.8; }
    else cover(t, r.w, r.h, .8);
  }
  if(r.v){ r.v.currentTime = 0; r.v.play().catch(()=>{}); }
  front(viewerG); viewerG.rotation.z = -.026; viewerG.visible = true;
  clearInterval(typer); let k = 0;
  typer = setInterval(() => { vCapT.redraw((x,w,h) => fitText(x,it.caption,w/2,h/2,w-40,h-10,'500 #px '+HAND,54,'#4a2a30',++k)); if(k >= it.caption.length) clearInterval(typer); }, 38);
  if(!taken.has(i)){
    taken.add(i); drawHud();
    papers[i].userData.mats.forEach(m => { m.transparent = true; m.opacity = .25; if(m !== papers[i].userData.mats[2]) m.color.setScalar(.6); });
  }
}
function closeViewer(){
  clearInterval(typer); viewerG.visible = false; state = 'browse';
  if(taken.size === N) setTimeout(openFinale, 700);
}

/* ---------- finale ---------- */
const daysText = () => { const ms = Date.now()-new Date(START_DATE+'T00:00:00').getTime(), f = Math.floor; return `Insieme da ${f(ms/864e5)} giorni, ${f(ms/36e5)%24} ore, ${f(ms/6e4)%60} minuti e ${f(ms/1e3)%60} secondi`; };
function drawFin(x,w,h){
  x.fillStyle = 'rgba(20,6,14,.88)'; rrect(x,0,0,w,h,60); x.fill(); x.textAlign = 'center'; x.textBaseline = 'middle';
  x.save(); x.shadowColor = 'rgba(255,143,163,.8)'; x.shadowBlur = 36; x.fillStyle = '#fff'; x.font = '700 120px '+HAND;
  x.fillText('Tanti auguri,', w/2, 140); x.font = '700 150px '+HAND; x.fillText(NOME, w/2, 290); x.restore();
  x.fillStyle = '#ff8fa3'; x.font = 'italic 500 40px '+SERIF; x.fillText('15 anni e tutto il mio cuore', w/2, 420);
  fitText(x, FINAL_TEXT, w/2, 730, w-160, 400, '500 #px '+SERIF, 36, '#f3dfe2');
  if(START_DATE) fitText(x, daysText(), w/2, 1010, w-120, 110, '500 #px '+HAND, 46, '#ffd9a0');
  x.fillStyle = '#ff8fa3'; x.font = '700 80px '+HAND; x.fillText('Il tuo, per sempre ♥', w/2, 1150);
}
const finG = new THREE.Group(); finG.userData = {dist:1.3}; finG.visible = false; scene.add(finG);
const finP = panel(1.0,1.36,1024,drawFin), finBtn = button('Rivedi i ricordi', .5, .12, () => { finG.visible = false; rain.visible = false; state = 'browse'; });
finBtn.position.set(0,-.8,.01); finG.add(finP, finBtn);
const RN = 140, rp = new Float32Array(RN*3), rc_ = new Float32Array(RN*3), rv = [], pal = ['#ff6f91','#ff9671','#ffc75f','#f9f871','#ffb3c6','#ffffff'];
for(let i = 0; i < RN; i++){ const a = Math.random()*6.283, r = .4+Math.random()*1.6; rp.set([Math.sin(a)*r, -1.5+Math.random()*3, Math.cos(a)*r], i*3); new THREE.Color(pal[i%pal.length]).toArray(rc_, i*3); rv.push(.25+Math.random()*.45); }
const rg = new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(rp,3)).setAttribute('color', new THREE.BufferAttribute(rc_,3));
const heartT = ctex(64,64,x => { x.fillStyle = '#fff'; x.font = '56px serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('♥',32,36); });
const rain = new THREE.Points(rg, new THREE.PointsMaterial({map:heartT, size:.13, vertexColors:true, transparent:true, depthWrite:false, alphaTest:.1}));
rain.visible = false; rain.frustumCulled = false; scene.add(rain);
function openFinale(){
  state = 'finale'; front(finG); finG.visible = true; rain.position.copy(head.p); rain.visible = true;
  if(START_DATE){ clearInterval(openFinale.t); openFinale.t = setInterval(() => finG.visible && finP.userData.tex.redraw(drawFin), 1000); }
}

/* ---------- interazione: controller, mani (pizzico) e mouse ---------- */
const targets = () => state === 'intro' ? [introBtn] : state === 'view' ? [vClose] : state === 'finale' ? [finBtn] : [...papers, musicBtn];
const rc = new THREE.Raycaster(), m4 = new THREE.Matrix4(), ctrls = [];
function cast(c){
  m4.identity().extractRotation(c.matrixWorld); rc.ray.origin.setFromMatrixPosition(c.matrixWorld); rc.ray.direction.set(0,0,-1).applyMatrix4(m4);
  return rc.intersectObjects(targets(), false)[0];
}
for(let i = 0; i < 2; i++){
  const c = renderer.xr.getController(i); scene.add(c);
  c.userData.line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0,0,-1)]), new THREE.LineBasicMaterial({color:0xffd9a0, transparent:true, opacity:.8}));
  c.add(c.userData.line);
  c.addEventListener('selectstart', () => { const h = c.visible && cast(c); if(h && h.object.userData.click) h.object.userData.click(); });
  c.addEventListener('squeezestart', recenter);          // grip = ricentra tutto davanti a te
  ctrls.push(c);
}
renderer.domElement.addEventListener('pointerdown', e => {   // anteprima su PC
  if(renderer.xr.isPresenting) return;
  rc.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1), camera);
  const h = rc.intersectObjects(targets(), false)[0]; if(h && h.object.userData.click) h.object.userData.click();
});
renderer.domElement.addEventListener('pointermove', e => {
  if(!e.buttons || renderer.xr.isPresenting) return;
  camera.rotation.y -= e.movementX*.004; camera.rotation.x = Math.max(-1, Math.min(1, camera.rotation.x - e.movementY*.004));
});
addEventListener('keydown', e => { if(e.key === 'r') recenter(); });
renderer.xr.addEventListener('sessionstart', () => { needPlace = true; playAll(); });

/* ---------- ciclo di rendering ---------- */
front(introG); recenter(); playAll();
const hov = new Set();
renderer.setAnimationLoop((t, frame) => {
  const s = t/1000, dt = Math.min(.05, (t-last)/1000 || .016); last = t;
  const xr = renderer.xr.isPresenting;
  if(frame){
    const rs = renderer.xr.getReferenceSpace(), p = rs && frame.getViewerPose(rs);
    if(p){ const T = p.transform; head.p.set(T.position.x,T.position.y,T.position.z); head.q.set(T.orientation.x,T.orientation.y,T.orientation.z,T.orientation.w);
      if(needPlace){ needPlace = false; front(introG); recenter(); } }
  } else if(!xr){ head.q.copy(camera.quaternion); }
  hov.clear();
  ctrls.forEach(c => { c.userData.line.visible = xr && c.visible; const h = xr && c.visible && cast(c); c.userData.line.scale.z = h ? h.distance : 2; if(h) hov.add(h.object); });
  targets().forEach(o => { const g = o.userData.group || o, k = hov.has(o) ? 1.07 : 1; g.scale.setScalar(g.scale.x + (k-g.scale.x)*Math.min(1, dt*12)); });
  pivots.forEach(p => p.rotation.z = Math.sin(s*p.userData.w + p.userData.ph)*p.userData.am);
  lights.material.opacity = .6 + .35*Math.sin(s*2.2);
  if(rain.visible){ const a = rg.attributes.position; for(let i = 0; i < RN; i++){ let y = a.getY(i) - dt*rv[i]; if(y < -1.5) y = 1.5; a.setY(i,y); } a.needsUpdate = true; }
  renderer.render(scene, camera);
});
</script>
