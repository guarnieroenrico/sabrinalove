
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Per Sabrina ♡</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #000;
  color: white;
  font-family: "Cormorant Garamond", Georgia, serif;
  overflow: hidden;
  min-height: 100vh;
}

#background-image {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: .30;
  filter: brightness(.62) saturate(.72);
  z-index: 0;
}

.shade {
  position: fixed;
  inset: 0;
  z-index: 1;
  background: linear-gradient(
    180deg,
    rgba(0,0,0,.55),
    rgba(0,0,0,.34),
    rgba(0,0,0,.72)
  );
  pointer-events: none;
}

.intro {
  position: fixed;
  inset: 0;
  z-index: 3;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 26px;
}

h1 {
  margin: 0;
  color: #f0d8e1;
  font-size: clamp(30px, 8vw, 48px);
  line-height: 1.2;
  font-weight: 400;
  font-style: italic;
  text-shadow: 0 2px 22px #000;
}

button {
  margin-top: 34px;
  padding: 10px 30px 12px;
  border: 1px solid rgba(232,196,210,.72);
  border-radius: 999px;
  background: rgba(8,5,8,.28);
  color: #f0d8e1;
  font: italic 500 23px "Cormorant Garamond", Georgia, serif;
  cursor: pointer;
}

#chat {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 2;
  overflow-y: auto;
  padding: 28px 14px 34px;
  text-align: center;
  scrollbar-width: none;
}

.message {
  width: fit-content;
  max-width: 96%;
  margin: 11px auto;
  color: #f4dce5;
  font-size: clamp(23px, 6vw, 30px);
  line-height: 1.12;
  font-style: italic;
  font-weight: 500;
  text-shadow: 0 2px 14px #000, 0 0 15px rgba(220,151,177,.55);
  animation: appear .75s ease both;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>

<img id="background-image" src="media/IMG_1355.jpeg" alt="">

<div class="shade"></div>

<section class="intro" id="intro">
  <h1>Lo sai una cosa Sabrina...?</h1>
  <button onclick="startLove()">Cosa...? ♡</button>
</section>

<main id="chat" aria-live="polite"></main>

<script>
const messages = [
  "Ti amo Sabrina ♡",
  "Ti amo amore mio",
  "Sei il mio pensiero più bello",
  "Ti amo infinitamente ♡",
  "Sei speciale per me",
  "Il mio cuore sceglie te",
  "Ti amo, sempre",
  "Sei la mia felicità ♡",
  "Amore mio, ti amo",
  "Tu, soltanto tu ♡"
];

let index = 0;

function startLove() {
  document.getElementById("intro").style.display = "none";

  const chat = document.getElementById("chat");
  chat.style.display = "block";

  setInterval(() => {
    const msg = document.createElement("div");
    msg.className = "message";
    msg.textContent = messages[index % messages.length];

    chat.appendChild(msg);
    index++;

    chat.scrollTop = chat.scrollHeight;
  }, 420);
}
</script>

</body>
</html>
