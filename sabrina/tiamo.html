
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Per Sabrina ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: white;
  font-family: 'Cormorant Garamond', serif;
  overflow: hidden;
  min-height: 100vh;
}

.intro {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
}

h1 {
  color: #e8b8c8;
  font-size: 36px;
  font-weight: 400;
  font-style: italic;
  letter-spacing: 1px;
  text-shadow: 0 0 20px #9b526d;
}

button {
  margin-top: 30px;
  padding: 12px 35px;
  background: transparent;
  border: 1px solid #d6a5b6;
  border-radius: 40px;
  color: #e8b8c8;
  font-family: inherit;
  font-size: 21px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: .3s;
}

button:active {
  background: #4c2635;
}

#chat {
  display: none;
  position: fixed;
  inset: 0;
  overflow-y: auto;
  padding: 25px 10px;
  text-align: center;
  scrollbar-width: none;
}

.message {
  width: fit-content;
  max-width: 95%;
  margin: 12px auto;
  color: #e8b8c8;
  font-size: 25px;
  font-style: italic;
  font-weight: 500;
  letter-spacing: 1px;
  text-shadow: 0 0 12px #a85b76;
  animation: appear .8s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>

<div class="intro" id="intro">
  <h1>Lo sai una cosa Sabrina...?</h1>
  <button onclick="startLove()">Cosa...? ♡</button>
</div>

<div id="chat"></div>

<script>
const messages = [
  "Ti amo Sabrina ♡",
  "Ti amo amore mio",
  "Sei il mio pensiero più bello",
  "Ti amo infinitamente ♡",
  "Sei speciale per me",
  "Il mio cuore sceglie te",
  "Ti amo, sempre",
  "Sei la mia felicità ♡",
  "Amore mio, ti amo",
  "Tu, soltanto tu ♡"
];

let index = 0;

function startLove() {
  document.getElementById("intro").style.display = "none";

  const chat = document.getElementById("chat");
  chat.style.display = "block";

  setInterval(() => {
    const msg = document.createElement("div");
    msg.className = "message";
    msg.textContent = messages[index % messages.length];

    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;

    index++;
  }, 350);
}
</script>

</body>
</html>
