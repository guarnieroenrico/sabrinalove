<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Per Sabrina ♥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#3b1a2a; --bg2:#1e0e18; --paper:#fffaf2; --ink:#4a2a30; --rose:#ff8fa3; --gold:#ffd9a0;
    --hand:'Caveat','Segoe Script','Bradley Hand',cursive;
    --serif:'Playfair Display',Georgia,serif;
    --fg:#fff; --fg2:#f3dfe2; --lc:#ffd9a0; --glow:rgba(255,200,130,.55); --hudbg:rgba(0,0,0,.35); --string:#d9b98a;
    --bgimg:radial-gradient(ellipse at 50% 20%,#3b1a2a 0%,#1e0e18 75%);
    --introbg:radial-gradient(ellipse at 50% 30%,#4a2034 0%,#1a0b14 80%);
    --finbg:rgba(20,6,14,.88); --viewbg:rgba(18,6,12,.78);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg2);color:var(--fg);font-family:var(--serif)}
  body{background:var(--bgimg)}

  /* luci */
  #lights{position:fixed;inset:0;pointer-events:none;z-index:1}
  #lights i{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--lc);
    box-shadow:0 0 14px 5px var(--glow);animation:tw 3s ease-in-out infinite alternate}
  @keyframes tw{from{opacity:.25;transform:scale(.8)}to{opacity:1;transform:scale(1.15)}}
  #lights i.t{width:auto;height:auto;background:none;box-shadow:none;color:var(--lc);font-style:normal;line-height:1;text-shadow:0 0 10px var(--glow)}

  /* scena */
  #scroller{position:fixed;inset:0;overflow-x:auto;overflow-y:hidden;z-index:2;scrollbar-width:none;scroll-behavior:smooth}
  #scroller::-webkit-scrollbar{display:none}
  #rail{position:relative;height:100%}
  #hang{position:absolute;left:0;top:max(calc(50vh - 250px),16px);width:100%;height:520px}
  #string{position:absolute;left:0;top:0;overflow:visible}
  #string path{fill:none;stroke:var(--string);stroke-width:2.5;stroke-linecap:round;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}

  .pol{position:absolute;top:66px;width:220px;background:var(--paper);padding:12px 12px 14px;border-radius:3px;
    box-shadow:0 14px 28px rgba(0,0,0,.45);cursor:pointer;transform-origin:50% 0;
    animation:sway var(--t,5s) ease-in-out var(--d,0s) infinite alternate;
    transition:opacity .6s,filter .6s}
  @keyframes sway{from{transform:rotate(var(--r1))}to{transform:rotate(var(--r2))}}
  .pol:hover{animation-play-state:paused;transform:rotate(0deg) scale(1.04)}
  .pol .pin{position:absolute;top:-22px;left:50%;width:16px;height:40px;margin-left:-8px;border-radius:4px;
    background:linear-gradient(90deg,#c9985f,#e6bf8a 50%,#b98348);box-shadow:0 2px 4px rgba(0,0,0,.4)}
  .pol .pin::after{content:"";position:absolute;left:50%;top:14px;width:2px;height:12px;margin-left:-1px;background:rgba(0,0,0,.25)}
  .pol .ph-wrap,.pol .frame{position:relative;width:196px;height:245px;overflow:hidden;background:#222}
  .pol .cap{font-family:var(--hand);font-size:22px;line-height:1.05;color:var(--ink);text-align:center;
    height:66px;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:4px 4px 0}
  .pol.taken{opacity:.14;filter:grayscale(1);pointer-events:auto}
  .pol.taken .pin{opacity:.5}

  .frame img,.frame video{width:100%;height:100%;object-fit:cover;display:block}
  .big .frame video{object-fit:contain;background:#111}
  .ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:rgba(255,255,255,.92);font-family:var(--hand);font-size:22px}
  .ph b{font-size:54px;line-height:1;font-weight:400;text-shadow:0 4px 14px rgba(0,0,0,.25)}
  .badge{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);
    display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;padding-left:2px}

  /* intro */
  #intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
    background:var(--introbg);transition:opacity 1s,visibility 1s}
  #intro.hide{opacity:0;visibility:hidden}
  #intro small{font-family:var(--hand);font-size:28px;color:var(--gold);letter-spacing:.04em}
  #intro h1{font-family:var(--hand);font-weight:700;font-size:clamp(64px,16vw,130px);line-height:1;margin:6px 0 4px;color:var(--fg);text-shadow:0 0 30px rgba(255,143,163,.55)}
  #intro .age{font-family:var(--serif);font-style:italic;font-size:clamp(20px,4vw,28px);color:var(--rose);margin-bottom:22px}
  #intro p{max-width:30ch;font-size:clamp(16px,3.6vw,20px);line-height:1.5;color:var(--fg2);margin-bottom:34px}
  .btn{font-family:var(--hand);font-size:28px;font-weight:700;color:#fff;background:linear-gradient(135deg,#ff6f91,#ff9671);border:0;border-radius:999px;
    padding:12px 36px;cursor:pointer;box-shadow:0 10px 26px rgba(255,111,145,.45);transition:transform .2s}
  .btn:hover{transform:scale(1.06)}
  .btn:active{transform:scale(.97)}
  #arBtn{display:none;margin-top:18px;font-family:var(--hand);font-size:24px;color:var(--gold);border:2px solid var(--gold);border-radius:999px;padding:6px 24px;text-decoration:none}
  #arBtn.on{display:inline-block}

  /* hud */
  #hud{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));z-index:5;display:flex;justify-content:center;pointer-events:none;opacity:0;transition:opacity 1s}
  #hud.on{opacity:1}
  #hud span{font-family:var(--hand);font-size:24px;color:var(--fg);background:var(--hudbg);padding:6px 20px;border-radius:999px;backdrop-filter:blur(6px)}
  #hint{position:fixed;right:22px;bottom:78px;z-index:5;font-family:var(--hand);font-size:26px;color:var(--gold);opacity:0;pointer-events:none;animation:nudge 1.4s ease-in-out infinite alternate}
  #hint.on{opacity:.95}
  @keyframes nudge{from{transform:translateX(0)}to{transform:translateX(12px)}}
  #music{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:6;width:44px;height:44px;border-radius:50%;border:0;background:var(--hudbg);color:var(--fg);font-size:20px;cursor:pointer;display:none}
  #music.on{display:block}
  #music.off{opacity:.55}

  /* viewer */
  #viewer{position:fixed;inset:0;z-index:12;background:var(--viewbg);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:18px;padding:18px;opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
  #viewer.open{opacity:1;visibility:visible}
  .big{background:var(--paper);padding:16px 16px 20px;border-radius:4px;box-shadow:0 30px 70px rgba(0,0,0,.6);
    width:min(88vw,430px);transform:translateY(40px) rotate(-3deg) scale(.9);transition:transform .6s cubic-bezier(.2,1.2,.3,1)}
  #viewer.open .big{transform:translateY(0) rotate(-1.5deg) scale(1)}
  .big .frame{width:100%;aspect-ratio:4/5;max-height:64vh;background:#222;position:relative;overflow:hidden}
  .big .frame .ph b{font-size:90px}
  .big .cap{font-family:var(--hand);font-size:clamp(26px,6vw,34px);line-height:1.1;color:var(--ink);text-align:center;margin-top:14px;min-height:2.3em}
  .caret::after{content:"|";animation:bl .7s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}

  /* finale */
  #finale{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--finbg);
    opacity:0;visibility:hidden;transition:opacity 1.2s,visibility 1.2s;overflow:auto}
  #finale.open{opacity:1;visibility:visible}
  #fx{position:fixed;inset:0;z-index:0;pointer-events:none}
  .card{position:relative;z-index:1;max-width:560px;text-align:center;padding:10px}
  .card h2{font-family:var(--hand);font-weight:700;font-size:clamp(54px,13vw,96px);line-height:1;color:var(--fg);text-shadow:0 0 28px rgba(255,143,163,.6);margin-bottom:10px}
  .card .sub{font-style:italic;color:var(--rose);font-size:clamp(18px,4vw,24px);margin-bottom:22px}
  .card p{font-size:clamp(16px,3.8vw,20px);line-height:1.65;color:var(--fg2);margin-bottom:18px;white-space:pre-line}
  .card .days{font-family:var(--hand);font-size:30px;color:var(--gold);margin:6px 0 22px}
  .card video{width:100%;max-height:50vh;border-radius:10px;margin-bottom:22px;background:#000}
  .sig{font-family:var(--hand);font-size:36px;color:var(--rose);margin-bottom:26px}

  #themeBtn{position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;z-index:40;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:20px;cursor:pointer}
  #themes{position:fixed;top:max(66px,calc(env(safe-area-inset-top) + 52px));left:14px;z-index:40;display:none;flex-direction:column;gap:8px;background:rgba(0,0,0,.6);padding:10px;border-radius:14px;backdrop-filter:blur(8px)}
  #themes.open{display:flex}
  #themes button{font-family:var(--hand);font-size:22px;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 16px;cursor:pointer;text-align:left}
  #themes button.on{background:linear-gradient(135deg,#ff6f91,#ff9671);border-color:transparent}

  #bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#1e0e18}
  #bg .l{position:absolute;inset:-10%;background-size:cover;background-position:center;filter:blur(24px) brightness(.62) saturate(1.15);
    opacity:0;transform:scale(1.08);transition:opacity 2.4s ease, transform 12s linear}
  #bg .l.on{opacity:1;transform:scale(1.18)}
  #bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(40,10,25,.15) 0%,rgba(20,6,14,.72) 100%)}
</style>
</head>
<body>

<div id="bg"></div>
<div id="lights"></div>
<button id="themeBtn" title="Cambia sfondo">🎨</button>
<div id="themes"></div>
<button id="music" title="Musica">♪</button>

<div id="intro">
  <small>per te</small>
  <h1 id="nm">Sabrina</h1>
  <div class="age">quindici anni di meraviglia</div>
  <p>Ho appeso i nostri momenti a un filo. Staccali uno a uno, sono tutti per te.</p>
  <button class="btn" id="start">Inizia ♥</button>
  <a id="arBtn" href="index_telefono.html">Vivila in AR 📱</a>
</div>

<div id="scroller"><div id="rail"><div id="hang"><svg id="string"><path id="sp"/></svg></div></div></div>
<div id="hint">scorri →</div>
<div id="hud"><span id="count"></span></div>

<div id="viewer">
  <div class="big">
    <div class="frame" id="vframe"></div>
    <div class="cap" id="vcap"></div>
  </div>
  <button class="btn" id="vclose">Tienila nel cuore ♥</button>
</div>

<div id="finale">
  <canvas id="fx"></canvas>
  <div class="card">
    <h2 id="fh">Tanti auguri, Sabrina</h2>
    <div class="sub">15 anni e tutto il mio cuore</div>
    <div id="fvideo"></div>
    <p id="ftext"></p>
    <div class="days" id="fdays"></div>
    <div class="sig">Il tuo, per sempre ♥</div>
    <button class="btn" id="fclose">Rivedi i ricordi</button>
  </div>
</div>

<!-- Creato da prepara_media.py (facoltativo): se esiste, sostituisce i segnaposto con le vostre foto -->
<script src="media_config.js" onerror="void 0"></script>
<script>
/* ============ CONFIGURAZIONE (modifica qui) ============ */
const NOME        = "Sabrina";
const START_DATE  = null;            // la data da cui state insieme, es. "2026-03-14" (lascia null per non mostrarla)
const MUSIC       = "musica.mp3";    // la vostra canzone: metti il file accanto a index.html
const FINAL_VIDEO = "";              // es. "media/auguri.mp4" per il tuo video di auguri nel finale
const FINAL_TEXT  =
`Non so come fai a rendere speciale anche il giorno più normale.
Ti auguro un anno pieno di sorrisi, di cose che ti fanno battere forte il cuore e di sogni che si avverano.
Qualunque cosa succeda, io sono qui, a fare il tifo per te.`;

/* Frasi e segnaposto: vengono sostituiti dalle tue foto/video (vedi prepara_media.py) */
const DEFAULT_ITEMS = [
  {type:"photo", src:"", caption:"Il giorno in cui ti ho vista e il mondo ha rallentato."},
  {type:"photo", src:"", caption:"Il tuo sorriso è il mio posto preferito."},
  {type:"video", src:"", caption:"Ascolta come ridi: è la mia canzone preferita."},
  {type:"photo", src:"", caption:"Con te anche le giornate storte diventano belle."},
  {type:"photo", src:"", caption:"Lì ho capito che eri tu."},
  {type:"video", src:"", caption:"Piccoli momenti, grandi ricordi."},
  {type:"photo", src:"", caption:"Sei la mia persona preferita con cui perdere tempo."},
  {type:"photo", src:"", caption:"Ogni giorno con te è un regalo."},
  {type:"photo", src:"", caption:"Non cambiare mai: sei perfetta così."},
  {type:"video", src:"", caption:"Un messaggio solo per te..."},
  {type:"photo", src:"", caption:"Quindici anni e già così speciale."},
  {type:"photo", src:"", caption:"E questo è solo l'inizio della nostra storia."}
];
/* ======================================================== */

const DEFAULT_THEME = "notte";   // scegli: notte, tramonto, stelle, crema, pastello
const SHOW_THEME_PICKER = false;  // metti false quando hai scelto lo sfondo, per togliere il pulsante 🎨

const ITEMS = (window.MEDIA && window.MEDIA.length) ? window.MEDIA : DEFAULT_ITEMS;
const N = ITEMS.length;

/* sfondo con le vostre foto (sfocate) */
(function(){
  const pics = ITEMS.filter(it=>it.type==="photo" && it.src).map(it=>it.src);
  const bg = document.getElementById("bg");
  if(!pics.length) return;
  const layers = pics.map(src=>{
    const d = document.createElement("div"); d.className = "l";
    d.style.backgroundImage = `url("${src}")`; bg.appendChild(d); return d;
  });
  let k = 0;
  const show = ()=>{ layers.forEach((l,i)=>l.classList.toggle("on", i===k)); k = (k+1) % layers.length; };
  show(); if(layers.length>1) setInterval(show, 7000);
})();
const $ = s => document.querySelector(s);
document.title = "Per " + NOME + " ♥";
$("#nm").textContent = NOME;
if(matchMedia("(pointer:coarse)").matches && Math.min(screen.width,screen.height) <= 820) $("#arBtn").classList.add("on");   /* pulsante AR: solo da telefono */
$("#fh").textContent = "Tanti auguri, " + NOME;
$("#ftext").textContent = FINAL_TEXT;

/* temi / sfondi */
const THEMES = {
  notte:{label:"Notte romantica",lights:"dots",n:22,v:{
    "--bg2":"#1e0e18","--bgimg":"radial-gradient(ellipse at 50% 20%,#3b1a2a 0%,#1e0e18 75%)",
    "--introbg":"radial-gradient(ellipse at 50% 30%,#4a2034 0%,#1a0b14 80%)","--fg":"#fff","--fg2":"#f3dfe2","--rose":"#ff8fa3","--gold":"#ffd9a0",
    "--lc":"#ffd9a0","--glow":"rgba(255,200,130,.55)","--hudbg":"rgba(0,0,0,.35)","--string":"#d9b98a","--finbg":"rgba(20,6,14,.88)","--viewbg":"rgba(18,6,12,.78)"}},
  tramonto:{label:"Tramonto",lights:"dots",n:18,v:{
    "--bg2":"#2b1055","--bgimg":"linear-gradient(180deg,#2b1055 0%,#7b2d83 32%,#ff6f91 68%,#ffb677 100%)",
    "--introbg":"linear-gradient(180deg,#2b1055 0%,#8a2f86 45%,#ff6f91 100%)","--fg":"#fff","--fg2":"#fff0f3","--rose":"#ffd1dc","--gold":"#fff1c9",
    "--lc":"#fff1c9","--glow":"rgba(255,240,200,.65)","--hudbg":"rgba(43,16,85,.4)","--string":"#ffe6c7","--finbg":"rgba(60,15,70,.9)","--viewbg":"rgba(43,16,85,.78)"}},
  stelle:{label:"Cielo stellato",lights:"stars",n:42,v:{
    "--bg2":"#04061a","--bgimg":"radial-gradient(ellipse at 50% 0%,#1b2a6b 0%,#0a0f2e 60%,#04061a 100%)",
    "--introbg":"radial-gradient(ellipse at 50% 20%,#233586 0%,#080c26 80%)","--fg":"#fff","--fg2":"#dfe6ff","--rose":"#ffb3c6","--gold":"#fff6c8",
    "--lc":"#fff6c8","--glow":"rgba(190,205,255,.75)","--hudbg":"rgba(0,0,0,.4)","--string":"#c9d4ff","--finbg":"rgba(4,6,26,.9)","--viewbg":"rgba(4,6,26,.82)"}},
  crema:{label:"Carta e cuori",lights:"hearts",n:16,v:{
    "--bg2":"#f3dcc4","--bgimg":"radial-gradient(ellipse at 50% 30%,#fff7ec 0%,#f3dcc4 100%)",
    "--introbg":"radial-gradient(ellipse at 50% 30%,#fff7ec 0%,#f0d6bd 100%)","--fg":"#4a2a30","--fg2":"#6b4047","--rose":"#d9506f","--gold":"#b4623a",
    "--lc":"#f2a7b5","--glow":"rgba(255,255,255,0)","--hudbg":"rgba(255,255,255,.65)","--string":"#8a5a3a","--finbg":"rgba(255,244,230,.94)","--viewbg":"rgba(250,235,220,.86)"}},
  pastello:{label:"Rosa pastello",lights:"hearts",n:26,v:{
    "--bg2":"#ffc2d4","--bgimg":"linear-gradient(160deg,#ffd6e0 0%,#ffc2d4 42%,#e8c1ff 100%)",
    "--introbg":"linear-gradient(160deg,#ffd6e0 0%,#ffc2d4 50%,#e8c1ff 100%)","--fg":"#5a2a45","--fg2":"#7a3d5e","--rose":"#e0457b","--gold":"#c2306a",
    "--lc":"#ffffff","--glow":"rgba(255,255,255,.9)","--hudbg":"rgba(255,255,255,.6)","--string":"#b0507a","--finbg":"rgba(255,225,238,.94)","--viewbg":"rgba(120,40,80,.6)"}}
};
function applyTheme(k){
  const t = THEMES[k] || THEMES[DEFAULT_THEME] || THEMES.notte;
  Object.entries(t.v).forEach(([a,b])=>document.documentElement.style.setProperty(a,b));
  const L = $("#lights"); L.innerHTML = "";
  for(let i=0;i<t.n;i++){
    const d = document.createElement("i");
    if(t.lights !== "dots"){ d.className = "t"; d.textContent = t.lights==="hearts" ? "♥" : "✦"; d.style.fontSize = (10+Math.random()*(t.lights==="hearts"?18:10))+"px"; }
    d.style.left = (Math.random()*100)+"%";
    d.style.top = (Math.random()*100)+"%";
    d.style.animationDelay = (Math.random()*3)+"s";
    d.style.animationDuration = (2+Math.random()*3)+"s";
    L.appendChild(d);
  }
  document.querySelectorAll("#themes button").forEach(b=>b.classList.toggle("on", b.dataset.k===k));
  try{ localStorage.setItem("tema_sabrina", k); }catch(e){}
}
(function(){
  const box = $("#themes");
  Object.keys(THEMES).forEach(k=>{
    const b = document.createElement("button"); b.dataset.k = k; b.textContent = THEMES[k].label;
    b.addEventListener("click", ()=>applyTheme(k));
    box.appendChild(b);
  });
  $("#themeBtn").addEventListener("click", ()=>box.classList.toggle("open"));
  if(!SHOW_THEME_PICKER){ $("#themeBtn").style.display = "none"; }
  let k = DEFAULT_THEME;
  try{ const q = new URLSearchParams(location.search).get("tema"); if(q && THEMES[q]) k = q; else if(SHOW_THEME_PICKER){ const s = localStorage.getItem("tema_sabrina"); if(s && THEMES[s]) k = s; } }catch(e){}
  applyTheme(k);
})();

/* costruzione del filo */
const GAP = 262, PAD = 150, ANCHOR_Y = 66;
const railW = PAD*2 + (N-1)*GAP + 220;
$("#rail").style.width = railW + "px";
const hang = $("#hang"), svg = $("#string");
svg.setAttribute("width", railW); svg.setAttribute("height", 200);
const xs = ITEMS.map((_,i)=> PAD + 110 + i*GAP);
(function(){
  let d = `M -10 ${ANCHOR_Y-8}`;
  const pts = [-10, ...xs, railW+10];
  let px = pts[0];
  pts.slice(1).forEach(x=>{
    const mx=(px+x)/2;
    d += ` Q ${mx} ${ANCHOR_Y+58} ${x} ${ANCHOR_Y}`;
    px = x;
  });
  $("#sp").setAttribute("d", d.replace(/ M .*? Q/, " Q")); // primo punto
})();

function mediaEl(it, big, idx){
  const wrap = document.createElement("div");
  wrap.style.cssText = "width:100%;height:100%;position:relative";
  const hue = (idx*37 + 340) % 360;
  const placeholder = ()=>{
    wrap.innerHTML = `<div class="ph" style="background:linear-gradient(135deg,hsl(${hue} 70% 62%),hsl(${(hue+40)%360} 70% 55%))"><b>♥</b><span>qui la tua ${it.type==="video"?"video":"foto"}</span></div>`;
    if(it.type==="video") wrap.insertAdjacentHTML("beforeend",'<div class="badge">▶</div>');
  };
  if(!it.src){ placeholder(); return wrap; }
  if(it.type==="video"){
    const v = document.createElement("video");
    v.playsInline = true; v.preload = "metadata";
    v.src = it.src + (big ? "" : "#t=0.1");
    if(big){ v.controls = true; v.autoplay = true; v.loop = false; }
    else { v.muted = true; wrap.insertAdjacentHTML("beforeend",'<div class="badge">▶</div>'); }
    v.onerror = placeholder;
    wrap.prepend(v);
  } else {
    const im = new Image();
    im.src = it.src; im.alt = it.caption; im.loading = "lazy";
    im.style.cssText = "width:100%;height:100%;object-fit:cover;display:block";
    im.onerror = placeholder;
    wrap.appendChild(im);
  }
  return wrap;
}

/* polaroid */
const taken = new Set();
const pols = [];
ITEMS.forEach((it,i)=>{
  const p = document.createElement("div");
  p.className = "pol";
  p.style.left = (xs[i]-110) + "px";
  const r = 1.5 + Math.random()*3.5;
  const sign = i%2 ? 1 : -1;
  p.style.setProperty("--r1", (sign*r)+"deg");
  p.style.setProperty("--r2", (-sign*r*0.8)+"deg");
  p.style.setProperty("--t", (4+Math.random()*3)+"s");
  p.style.setProperty("--d", (-Math.random()*4)+"s");
  const f = document.createElement("div"); f.className="frame";
  f.appendChild(mediaEl(it,false,i));
  p.innerHTML = '<div class="pin"></div>';
  p.appendChild(f);
  const c = document.createElement("div"); c.className="cap"; c.textContent = it.caption;
  p.appendChild(c);
  p.addEventListener("click", ()=>openViewer(i));
  hang.appendChild(p); pols.push(p);
});

function updateCount(){ $("#count").textContent = `Ricordi staccati: ${taken.size} / ${N}`; }
updateCount();

/* scorrimento con rotellina */
const sc = $("#scroller");
sc.addEventListener("wheel", e=>{
  if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){ sc.style.scrollBehavior="auto"; sc.scrollLeft += e.deltaY; e.preventDefault(); }
},{passive:false});
sc.addEventListener("scroll", ()=>{ $("#hint").classList.remove("on"); }, {once:true});

/* musica */
const audio = new Audio(MUSIC); audio.loop = true; audio.volume = .6;
let musicOK = false;
audio.addEventListener("canplay", ()=>{ musicOK = true; $("#music").classList.add("on"); });
$("#music").addEventListener("click", ()=>{
  if(audio.paused){ audio.play(); $("#music").classList.remove("off"); }
  else { audio.pause(); $("#music").classList.add("off"); }
});

/* inizio */
$("#start").addEventListener("click", ()=>{
  $("#intro").classList.add("hide");
  $("#hud").classList.add("on");
  setTimeout(()=>$("#hint").classList.add("on"), 1200);
  audio.play().catch(()=>{});
});

/* viewer */
let typer = null, current = -1;
function typeText(el, text){
  clearInterval(typer); el.textContent = ""; el.classList.add("caret");
  let k = 0;
  typer = setInterval(()=>{
    el.textContent = text.slice(0,++k);
    if(k >= text.length){ clearInterval(typer); el.classList.remove("caret"); }
  }, 38);
}
function openViewer(i){
  current = i;
  const it = ITEMS[i];
  const fr = $("#vframe"); fr.innerHTML = ""; fr.appendChild(mediaEl(it,true,i));
  const v = fr.querySelector("video");
  if(v){
    v.muted = true; v.defaultMuted = true; v.volume = 0;   /* i video restano senza audio: continua solo la canzone */
    v.addEventListener("volumechange", ()=>{ if(!v.muted || v.volume>0){ v.muted = true; v.volume = 0; } });
    v.play().catch(()=>{});
  }
  $("#viewer").classList.add("open");
  typeText($("#vcap"), it.caption);
  if(!taken.has(i)){ taken.add(i); pols[i].classList.add("taken"); updateCount(); }
}
function closeViewer(){
  clearInterval(typer);
  const v = $("#vframe").querySelector("video"); if(v) v.pause();
  $("#viewer").classList.remove("open");
  setTimeout(()=>{ $("#vframe").innerHTML=""; }, 400);
  if(taken.size === N) setTimeout(openFinale, 700);
}
$("#vclose").addEventListener("click", closeViewer);
$("#viewer").addEventListener("click", e=>{ if(e.target.id==="viewer") closeViewer(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && $("#viewer").classList.contains("open")) closeViewer(); });

/* finale */
let fxRun = false, daysTimer;
function openFinale(){
  $("#finale").classList.add("open");
  if(FINAL_VIDEO){
    $("#fvideo").innerHTML = `<video src="${FINAL_VIDEO}" controls playsinline></video>`;
  }
  if(START_DATE){
    const upd = ()=>{
      const ms = Date.now() - new Date(START_DATE + "T00:00:00").getTime();
      const days = Math.floor(ms/86400000);
      const h = Math.floor(ms/3600000)%24, m = Math.floor(ms/60000)%60, s = Math.floor(ms/1000)%60;
      $("#fdays").textContent = `Insieme da ${days} giorni, ${h} ore, ${m} minuti e ${s} secondi`;
    };
    upd(); clearInterval(daysTimer); daysTimer = setInterval(upd, 1000);
  }
  startFx();
}
$("#fclose").addEventListener("click", ()=>{
  $("#finale").classList.remove("open"); fxRun = false;
  const v = $("#fvideo video"); if(v) v.pause();
  clearInterval(daysTimer);
  /* ricomincia da capo: le polaroid tornano a colori e il conteggio riparte da zero */
  taken.clear(); pols.forEach(p => p.classList.remove("taken")); updateCount();
  sc.scrollTo({left:0, behavior:"smooth"});
});

function startFx(){
  if(fxRun) return; fxRun = true;
  const cv = $("#fx"), cx = cv.getContext("2d");
  const fit = ()=>{ cv.width = innerWidth; cv.height = innerHeight; };
  fit(); addEventListener("resize", fit);
  const cols = ["#ff6f91","#ff9671","#ffc75f","#f9f871","#ffb3c6","#ffffff"];
  const ps = Array.from({length:70}, ()=>({
    x:Math.random()*innerWidth, y:Math.random()*-innerHeight,
    s:14+Math.random()*26, v:.8+Math.random()*1.6, w:Math.random()*Math.PI*2,
    c:cols[Math.floor(Math.random()*cols.length)], h:Math.random()<.7
  }));
  (function loop(){
    if(!fxRun){ cx.clearRect(0,0,cv.width,cv.height); return; }
    cx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{
      p.y += p.v; p.w += .03; p.x += Math.sin(p.w)*.7;
      if(p.y > cv.height+40){ p.y = -40; p.x = Math.random()*cv.width; }
      cx.globalAlpha = .85; cx.fillStyle = p.c;
      if(p.h){ cx.font = p.s+"px serif"; cx.fillText("♥", p.x, p.y); }
      else { cx.fillRect(p.x, p.y, p.s/3, p.s/2); }
    });
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
