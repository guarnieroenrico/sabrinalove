<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Per Sabrina ♥ (AR telefono)</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#4a2a30;--paper:#fffaf2;--gold:#ffd9a0;--hand:'Caveat','Segoe Script','Bradley Hand',cursive}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;color:#fff;font-family:var(--hand);-webkit-user-select:none;user-select:none;
  background:radial-gradient(ellipse at 50% 20%,#3b1a2a,#1e0e18 75%)}
#cam,#gl{position:fixed;inset:0;width:100%;height:100%}
#cam{object-fit:cover;filter:brightness(.8) saturate(1.1)}
#gl{touch-action:none}
.btn{font:700 28px var(--hand);color:#fff;background:linear-gradient(135deg,#ff6f91,#ff9671);border:0;border-radius:999px;padding:10px 32px;
  cursor:pointer;box-shadow:0 10px 26px rgba(255,111,145,.45);text-decoration:none;display:inline-block}
.btn:disabled{opacity:.55}
.ghost{background:none;box-shadow:none;border:2px solid rgba(255,217,160,.55);color:var(--gold);font-size:22px;padding:6px 22px}
.rb{position:fixed;z-index:6;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.4);color:#fff;font:22px/44px sans-serif;
  text-align:center;text-decoration:none;display:none;backdrop-filter:blur(6px)}
body.on .rb{display:block}
#back{top:max(14px,env(safe-area-inset-top));left:14px}
#music{top:max(14px,env(safe-area-inset-top));right:14px}
#recenter{bottom:max(18px,env(safe-area-inset-bottom));left:50%;margin-left:-22px}
#msg{position:fixed;z-index:6;top:max(66px,calc(env(safe-area-inset-top) + 52px));left:0;right:0;text-align:center;font-size:26px;color:var(--gold);
  padding:0 20px;pointer-events:none;text-shadow:0 2px 8px #000;opacity:0;transition:opacity 1s}
#enter{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;background:rgba(30,10,22,.78)}
#enter h1{font-size:clamp(54px,16vw,110px);line-height:1;text-shadow:0 0 30px rgba(255,143,163,.8)}
#enter p{font-size:24px;color:var(--gold);max-width:20em}
#viewer{position:fixed;inset:0;z-index:12;background:rgba(18,6,12,.78);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:18px;padding:18px;opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
#viewer.open{opacity:1;visibility:visible}
.big{background:var(--paper);padding:16px 16px 20px;border-radius:4px;box-shadow:0 30px 70px rgba(0,0,0,.6);width:min(88vw,430px);transform:rotate(-1.5deg)}
.frame{width:100%;aspect-ratio:4/5;max-height:60vh;background:#222;overflow:hidden}
.frame img,.frame video{width:100%;height:100%;object-fit:cover;display:block}
.frame video{object-fit:contain;background:#111}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:90px}
#vcap{font:500 clamp(26px,6vw,34px)/1.1 var(--hand);color:var(--ink);text-align:center;margin-top:14px;min-height:2.3em}
.caret::after{content:"|";animation:bl .7s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<a class="rb" id="back" href="index.html" title="Torna al sito">←</a>
<button class="rb" id="music" title="Musica">♪</button>
<button class="rb" id="recenter" title="Rimetti i ricordi davanti a te">⟲</button>
<div id="msg"></div>

<div id="enter">
  <h1>Sabrina</h1>
  <p>I ricordi sono appesi nell’aria intorno a te. Ti chiederò il permesso per fotocamera e movimento.</p>
  <button class="btn" id="go" disabled>Carico i ricordi…</button>
  <a class="btn ghost" href="index.html">← Torna al sito</a>
</div>

<div id="viewer">
  <div class="big"><div class="frame" id="vframe"></div><div id="vcap"></div></div>
  <button class="btn" id="vclose">Tienila nel cuore ♥</button>
</div>

<script src="media_config.js" onerror="void 0"></script>
<script>setTimeout(function(){if(!window.__ready){var b=document.getElementById('go');if(b)b.textContent='Non riesco a caricare: controlla la connessione'}},10000)</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
window.__ready = true;
(async () => {
const $ = s => document.querySelector(s);
const MUSIC = "musica.mp3";
const DEFAULT_ITEMS = [
  {type:"photo",caption:"Il giorno in cui ti ho vista e il mondo ha rallentato."},
  {type:"photo",caption:"Il tuo sorriso è il mio posto preferito."},
  {type:"video",caption:"Ascolta come ridi: è la mia canzone preferita."},
  {type:"photo",caption:"Con te anche le giornate storte diventano belle."},
  {type:"photo",caption:"Sei la mia persona preferita con cui perdere tempo."},
  {type:"photo",caption:"Non cambiare mai: sei perfetta così."},
  {type:"video",caption:"Un messaggio solo per te..."}
];
const ITEMS = (window.MEDIA && window.MEDIA.length) ? window.MEDIA : DEFAULT_ITEMS, N = ITEMS.length;
const HAND = 'Caveat,"Segoe Script",cursive', SRGB = THREE.SRGBColorSpace, D = Math.PI/180;
try { await Promise.all(['500 40px Caveat','700 40px Caveat'].map(f => document.fonts.load(f))); } catch(e) {}

/* ---------- scena: canvas trasparente sopra la fotocamera ---------- */
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setClearColor(0, 0);
const gl = renderer.domElement; gl.id = 'gl'; $('#cam').after(gl);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(60, 1, .05, 30);
function fit(){ renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.fov = innerHeight > innerWidth ? 62 : 50; camera.updateProjectionMatrix(); }
fit(); addEventListener('resize', fit);

const audio = new Audio(MUSIC); audio.loop = true; audio.volume = .7;
const startAudio = () => audio.play().catch(() => {});

/* ---------- utilità ---------- */
function ctex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = SRGB; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t;
}
const lift = (m,n) => { m.polygonOffset = true; m.polygonOffsetFactor = -n; m.polygonOffsetUnits = -n; };
function lines(x, t, maxW){
  const out = [];
  t.split('\n').forEach(par => { let l = ''; par.split(' ').forEach(w => { const n = l ? l+' '+w : w; if(l && x.measureText(n).width > maxW){ out.push(l); l = w; } else l = n; }); out.push(l); });
  return out;
}
function fitText(x, t, cx, cy, maxW, maxH, fam, size, color){
  let L;
  for(; size > 16; size -= 2){ x.font = fam.replace('#', size); L = lines(x, t, maxW); if(L.length*size*1.1 <= maxH) break; }
  x.fillStyle = color; x.textAlign = 'center'; x.textBaseline = 'middle';
  const lh = size*1.1, y0 = cy - (L.length-1)*lh/2; L.forEach((l,i) => x.fillText(l, cx, y0 + i*lh));
}
const PA = .25/.31, meds = [];
function phTex(i, type){
  return ctex(256, 320, (x,w,h) => {
    const hu = (i*37+340)%360, g = x.createLinearGradient(0,0,w,h);
    g.addColorStop(0,`hsl(${hu} 70% 62%)`); g.addColorStop(1,`hsl(${(hu+40)%360} 70% 55%)`);
    x.fillStyle = g; x.fillRect(0,0,w,h); x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = '110px serif'; x.fillText('♥', w/2, h/2-20); x.font = '34px '+HAND; x.fillText('qui la tua '+(type==='video'?'video':'foto'), w/2, h/2+70);
  });
}
function cover(t, iw, ih, a){
  const r = iw/ih; t.repeat.set(1,1); t.offset.set(0,0);
  if(r > a){ t.repeat.x = a/r; t.offset.x = (1-t.repeat.x)/2; } else { t.repeat.y = r/a; t.offset.y = (1-t.repeat.y)/2; }
}
function media(it, i, mat){          /* foto; i video hanno un'anteprima statica (si aprono nel visore) */
  const r = {};
  const bad = () => { r.tex = phTex(i, it.type); mat.map = r.tex; mat.needsUpdate = true; };
  if(!it.src){ bad(); return r; }
  if(it.type === 'video'){
    const v = document.createElement('video');
    Object.assign(v, {src:it.src, muted:true, loop:true, playsInline:true, preload:'auto'}); v.setAttribute('playsinline',''); r.v = v;
    r.tex = phTex(i, 'video');
    v.addEventListener('loadeddata', () => { v.currentTime = .1; });
    v.addEventListener('seeked', () => {
      const vw = v.videoWidth, vh = v.videoHeight;
      const t = ctex(384, 480, (x,w,h) => {
        const k = Math.max(w/vw, h/vh); x.drawImage(v, (w-vw*k)/2, (h-vh*k)/2, vw*k, vh*k);
        x.fillStyle = 'rgba(0,0,0,.55)'; x.beginPath(); x.arc(w-42,h-42,30,0,6.283); x.fill();
        x.fillStyle = '#fff'; x.font = '30px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('▶', w-39, h-41);
      });
      r.tex = t; mat.map = t; mat.needsUpdate = true;
    }, {once:true});
    v.addEventListener('error', bad);
  } else {
    r.tex = new THREE.TextureLoader().load(it.src, t => cover(t, t.image.width, t.image.height, PA), undefined, bad);
    r.tex.colorSpace = SRGB;
  }
  mat.map = r.tex; return r;
}

/* ---------- il filo con le polaroid, attorno a te ---------- */
const root = new THREE.Group(); root.position.y = .2; scene.add(root);
const R = 1.1, STEP = Math.min(.45/R, 6/N), pivots = [], papers = [];
const paperGeo = new THREE.PlaneGeometry(.30,.42), photoGeo = new THREE.PlaneGeometry(.25,.31), capGeo = new THREE.PlaneGeometry(.30,.07),
      pinGeo = new THREE.BoxGeometry(.014,.04,.008), shGeo = new THREE.PlaneGeometry(.32,.44), pinM = new THREE.MeshBasicMaterial({color:0xd9a868});
const spts = [];
for(let k = -1; k <= N; k++){
  const a = (k-(N-1)/2)*STEP; spts.push(new THREE.Vector3(Math.sin(a)*R, 0, -Math.cos(a)*R));
  if(k < N){ const b = a + STEP/2; spts.push(new THREE.Vector3(Math.sin(b)*R, -.06, -Math.cos(b)*R)); }
}
root.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(spts,false,'centripetal'), N*40, .007, 8), new THREE.MeshBasicMaterial({color:0xd9b98a})));
ITEMS.forEach((it, i) => {
  const a = (i-(N-1)/2)*STEP, pv = new THREE.Group();
  pv.position.set(Math.sin(a)*R, 0, -Math.cos(a)*R); pv.rotation.y = -a;
  pv.userData = {w:.8+Math.random()*.4, ph:Math.random()*6.28, am:.015+Math.random()*.02};
  const paperM = new THREE.MeshBasicMaterial({color:0xfffaf2}), photoM = new THREE.MeshBasicMaterial({color:0xffffff}),
        capM = new THREE.MeshBasicMaterial({map:ctex(600,140,(x,w,h) => fitText(x,it.caption,w/2,h/2,w-30,h-8,'500 #px '+HAND,40,'#4a2a30')), transparent:true}),
        shM = new THREE.MeshBasicMaterial({color:0, transparent:true, opacity:.28, depthWrite:false});
  lift(photoM,2); lift(capM,3); lift(pinM,4);
  const mk = (geo,m,y,z,ro) => { const o = new THREE.Mesh(geo,m); o.position.set(0,y,z); o.renderOrder = ro; pv.add(o); return o; };
  mk(shGeo, shM, -.222, -.012, 0);
  const paper = mk(paperGeo, paperM, -.21, 0, 1);
  mk(photoGeo, photoM, -.175, .004, 2); mk(capGeo, capM, -.375, .004, 3); mk(pinGeo, pinM, -.005, .012, 4);
  meds[i] = media(it, i, photoM);
  paper.userData = {click:() => openViewer(i)};
  root.add(pv); pivots.push(pv); papers.push(paper);
});
const glow = ctex(64,64,x => { const g = x.createRadialGradient(32,32,0,32,32,32); g.addColorStop(0,'#fff'); g.addColorStop(.3,'rgba(255,217,160,.6)'); g.addColorStop(1,'rgba(255,217,160,0)'); x.fillStyle = g; x.fillRect(0,0,64,64); });
const lp = new Float32Array(90*3);
for(let i = 0; i < 90; i++){ const a = Math.random()*6.283, r = .5+Math.random()*1.6; lp.set([Math.sin(a)*r, -.9+Math.random()*2, -Math.cos(a)*r], i*3); }
const lights = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(lp,3)),
  new THREE.PointsMaterial({map:glow, size:.07, color:0xffd9a0, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending}));
lights.frustumCulled = false; lights.renderOrder = -1; root.add(lights);

/* ---------- orientamento: giroscopio (iPhone e Android) o trascinamento ---------- */
const Y = new THREE.Vector3(0,1,0), Z = new THREE.Vector3(0,0,1), eu = new THREE.Euler(), qa = new THREE.Quaternion(),
      qb = new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5)), tq = new THREE.Quaternion();
let gyro = null, snap = true, rootYaw = 0, started = false;
const look = {yaw:0, pitch:0};
const aDiff = (a,b) => { let d = a-b; while(d > Math.PI) d -= 2*Math.PI; while(d < -Math.PI) d += 2*Math.PI; return d; };
function target(){
  if(gyro){
    const o = ((screen.orientation && screen.orientation.angle) || window.orientation || 0)*D;
    eu.set(gyro.b, gyro.a, -gyro.g, 'YXZ'); tq.setFromEuler(eu); tq.multiply(qb); tq.multiply(qa.setFromAxisAngle(Z, -o));
    tq.premultiply(qa.setFromAxisAngle(Y, look.yaw));
  } else { eu.set(look.pitch, look.yaw, 0, 'YXZ'); tq.setFromEuler(eu); }
}
function recenter(hard){            /* il filo si mette davanti a dove stai guardando */
  const d = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion); d.y = 0;
  if(d.lengthSq() < 1e-3) d.set(0,0,-1);
  d.normalize(); rootYaw = Math.atan2(-d.x, -d.z); if(hard) root.rotation.y = rootYaw;
}
const say = (t, ms = 6000) => { const m = $('#msg'); m.textContent = t; m.style.opacity = 1; clearTimeout(say.t); say.t = setTimeout(() => m.style.opacity = 0, ms); };

/* tocco = apri ricordo; trascinamento = gira la vista */
const rc = new THREE.Raycaster(); let ptr = null;
gl.addEventListener('pointerdown', e => { ptr = {sx:e.clientX, sy:e.clientY, lx:e.clientX, ly:e.clientY, moved:false}; try { gl.setPointerCapture(e.pointerId); } catch(_) {} });
gl.addEventListener('pointermove', e => {
  if(!ptr) return;
  if(!ptr.moved && Math.hypot(e.clientX-ptr.sx, e.clientY-ptr.sy) < 10) return;
  ptr.moved = true;
  const k = camera.fov*D/innerHeight;
  look.yaw += (e.clientX-ptr.lx)*k;
  if(!gyro) look.pitch = Math.max(-1.3, Math.min(1.3, look.pitch + (e.clientY-ptr.ly)*k));
  ptr.lx = e.clientX; ptr.ly = e.clientY;
});
gl.addEventListener('pointerup', e => {
  if(ptr && !ptr.moved && started){
    camera.updateMatrixWorld(); rc.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1), camera);
    const h = rc.intersectObjects(papers, false)[0]; if(h) h.object.userData.click();
  }
  ptr = null;
});
gl.addEventListener('pointercancel', () => { ptr = null; });

/* ---------- visore del ricordo (HTML sopra la fotocamera) ---------- */
let typer = null;
function bigMedia(it, i){
  const w = document.createElement('div'); w.style.cssText = 'width:100%;height:100%';
  const ph = () => { const h = (i*37+340)%360; w.innerHTML = `<div class="ph" style="background:linear-gradient(135deg,hsl(${h} 70% 62%),hsl(${(h+40)%360} 70% 55%))">♥</div>`; };
  if(!it.src){ ph(); return w; }
  const e = document.createElement(it.type === 'video' ? 'video' : 'img');
  if(it.type === 'video'){ Object.assign(e, {muted:true, loop:true, autoplay:true, playsInline:true}); e.setAttribute('playsinline',''); }
  e.src = it.src; e.onerror = ph; w.appendChild(e);
  if(it.type === 'video') e.play().catch(() => {});
  return w;
}
function openViewer(i){
  const it = ITEMS[i], fr = $('#vframe'), cap = $('#vcap');
  fr.innerHTML = ''; fr.appendChild(bigMedia(it, i));
  $('#viewer').classList.add('open');
  clearInterval(typer); cap.textContent = ''; cap.classList.add('caret'); let k = 0;
  typer = setInterval(() => { cap.textContent = it.caption.slice(0, ++k); if(k >= it.caption.length){ clearInterval(typer); cap.classList.remove('caret'); } }, 38);
}
function closeViewer(){
  clearInterval(typer); $('#viewer').classList.remove('open');
  setTimeout(() => { $('#vframe').innerHTML = ''; }, 400);
}
$('#vclose').onclick = closeViewer;
$('#viewer').addEventListener('click', e => { if(e.target.id === 'viewer') closeViewer(); });

/* ---------- ingresso: permessi (serve un tocco) ---------- */
async function startCam(){
  try {
    const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false});
    const v = $('#cam'); v.srcObject = s; await v.play().catch(() => {}); return true;
  } catch(e) { return false; }
}
$('#go').onclick = async () => {
  startAudio();
  let ok = true;
  if(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function'){   /* iPhone */
    try { ok = (await DeviceOrientationEvent.requestPermission()) === 'granted'; } catch(e) { ok = false; }
  }
  if(ok) addEventListener('deviceorientation', e => {
    if(e.alpha == null || e.beta == null) return;
    if(!gyro) snap = true;
    gyro = {a:e.alpha*D, b:e.beta*D, g:(e.gamma||0)*D};
  });
  await startCam();
  meds.forEach(r => r.v && r.v.play().then(() => r.v.pause()).catch(() => {}));   /* sblocca le anteprime dei video su iPhone */
  $('#enter').hidden = true; document.body.classList.add('on'); started = true;
  say(ok ? 'Gira intorno a te: i ricordi sono appesi nell’aria ♥' : 'Movimento non consentito: trascina il dito per guardarti intorno');
  setTimeout(() => { if(!gyro) say('Trascina il dito per guardarti intorno'); }, 1800);
  setTimeout(() => recenter(), 1500);
};
$('#recenter').onclick = () => recenter();
$('#music').onclick = () => { if(audio.paused){ audio.play(); $('#music').style.opacity = 1; } else { audio.pause(); $('#music').style.opacity = .5; } };
document.addEventListener('visibilitychange', () => { const v = $('#cam'); if(!document.hidden && v.srcObject) v.play().catch(() => {}); });
$('#go').disabled = false; $('#go').textContent = 'Entra in AR ♥';

/* ---------- ciclo di rendering ---------- */
let last = 0;
renderer.setAnimationLoop(t => {
  const s = t/1000, dt = Math.min(.05, (t-last)/1000 || .016); last = t;
  target();
  if(snap){ camera.quaternion.copy(tq); recenter(true); snap = false; } else camera.quaternion.slerp(tq, 1-Math.exp(-dt*18));
  root.rotation.y += aDiff(rootYaw, root.rotation.y)*(1-Math.exp(-dt*4));
  pivots.forEach(p => p.rotation.z = Math.sin(s*p.userData.w + p.userData.ph)*p.userData.am);
  lights.rotation.y = s*.03;
  renderer.render(scene, camera);
});
})();
</script>
</body>
</html>
